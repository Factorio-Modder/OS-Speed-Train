[item-description]
speed-train=Stainless steel body. Gull-wing doors were rejected by the safety committee.
speed-cargo-wagon=Built to keep up. Nobody calls this wagon slow.
speed-train-fuel=Pressed, colored and treated to burn hotter. Slower to get going, but nothing stops it once it's rolling.
speed-train-mk2=Built from parts that technically haven't been invented yet.
speed-cargo-wagon-mk2=Reinforced for speeds the original design never planned for. Not even in 2015.

[technology-name]
speed-train=Temporal displacement
speed-train-fuel=Hotter burning logs
speed-train-mk2=Part II

[technology-description]
speed-train=A capacitor of questionable origin turns out to fit perfectly into a locomotive. It even fluxes.
speed-train-fuel=Someone found an old recipe for logs that burn hotter. We swapped the logs for uranium, for safety reasons.
speed-train-mk2=Everything that made the first one great, with a bigger budget and more parts from far away.

