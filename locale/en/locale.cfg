page_main_intro=This mod adds faster rolling stock in two tiers, plus a fuel to go with it.\n\n[entity=speed-train] [entity=speed-cargo-wagon] The speed train and speed cargo wagon are the first tier. They are faster than the vanilla train but cost noticeably more.\n\n[entity=speed-train-mk2] [entity=speed-cargo-wagon-mk2] Mk2 is the endgame tier: faster, more powerful, bigger wagons. It is crafted from the first tier.\n\n[item=speed-train-fuel] Train fuel gives up the acceleration bonus of nuclear fuel for a higher top speed.\n\nThe other pages compare the stats and list what each technology needs and unlocks.
heading_upgrading=Upgrading from 2.0.x
page_main_upgrading=Version 2.1.0 rebalanced the speed train, which used to be far stronger than intended. The old stats live on as Mk2. Speed trains and speed cargo wagons in saves from before 2.1.0 were converted to Mk2, both placed ones and items, so nothing lost its stats or cargo.
heading_locomotives=Locomotives
heading_cargo_wagons=Cargo wagons
heading_mixing=Mixing tiers
page_rolling_stock_mixing=A train is only as fast as its slowest car. The speed cargo wagon is faster than the speed train, so it never holds it back, but it does slow down a Mk2 locomotive. Pair Mk2 locomotives with Mk2 wagons.
