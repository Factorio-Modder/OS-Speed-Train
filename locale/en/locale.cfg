page_fuel_intro=[item=speed-train-fuel] Train fuel holds as much energy as nuclear fuel, but trades the acceleration bonus for a higher top speed. It works best on long routes with few stops. On short routes with many stops, nuclear fuel usually gets there first.\n\nIt stacks to 1, so each fuel slot of a locomotive holds a single piece.
