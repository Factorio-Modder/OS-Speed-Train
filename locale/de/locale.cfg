[item-description]
speed-train=Karosserie aus Edelstahl. Flügeltüren wurden vom Sicherheitsausschuss abgelehnt.
speed-cargo-wagon=Gebaut, um mitzuhalten. Niemand nennt diesen Wagen lahm.
speed-train-fuel=Gepresst, gefärbt und so behandelt, dass er heißer brennt. Kommt langsamer in Fahrt, aber wenn er einmal rollt, hält ihn nichts mehr auf.
speed-train-mk2=Gebaut aus Teilen, die streng genommen noch gar nicht erfunden wurden.
speed-cargo-wagon-mk2=Verstärkt für Geschwindigkeiten, die der ursprüngliche Entwurf nie vorgesehen hat. Nicht einmal 2015.

