[technology-description]
speed-train=Ein Kondensator zweifelhafter Herkunft passt erstaunlich gut in eine Lokomotive. Er fluxt sogar.
speed-train-fuel=Jemand hat ein altes Rezept für Holzscheite gefunden, die heißer brennen. Aus Sicherheitsgründen haben wir die Scheite durch Uran ersetzt.
speed-train-mk2=Alles, was den ersten großartig gemacht hat, mit größerem Budget und mehr Teilen von weit weg.