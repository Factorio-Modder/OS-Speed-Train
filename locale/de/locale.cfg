page_main_intro=Diese Mod fügt schnellere Schienenfahrzeuge in zwei Stufen hinzu, dazu einen passenden Treibstoff.\n\n[entity=speed-train] [entity=speed-cargo-wagon] Schnellzug und Schnellzug Wagon sind die erste Stufe. Sie sind schneller als der normale Zug, kosten aber spürbar mehr.\n\n[entity=speed-train-mk2] [entity=speed-cargo-wagon-mk2] Mk2 ist die Endgame-Stufe: schneller, stärker, größere Wagons. Sie wird aus der ersten Stufe hergestellt.\n\n[item=speed-train-fuel] Der Schnellzug Treibstoff verzichtet auf den Beschleunigungsbonus von Kernbrennstoff und bringt dafür eine höhere Höchstgeschwindigkeit.\n\nDie anderen Seiten vergleichen die Werte und zeigen, was jede Technologie braucht und freischaltet.
heading_upgrading=Upgrade von 2.0.x
page_main_upgrading=Version 3.0.0 hat den Schnellzug neu ausbalanciert, der vorher viel stärker war als gedacht. Die alten Werte leben als Mk2 weiter. Schnellzüge und Schnellzug Wagons aus Spielständen vor 3.0.0 wurden in Mk2 umgewandelt, sowohl platzierte als auch Items. Es gehen also weder Werte noch Ladung verloren.
heading_locomotives=Lokomotiven
