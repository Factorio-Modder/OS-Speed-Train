page_fuel_intro=[item=speed-train-fuel] Der Schnellzug Treibstoff enthält genauso viel Energie wie Kernbrennstoff, tauscht aber den Beschleunigungsbonus gegen eine höhere Höchstgeschwindigkeit. Am besten eignet er sich für lange Strecken mit wenigen Halten. Auf kurzen Strecken mit vielen Halten ist Kernbrennstoff meist früher da.\n\nEr stapelt sich nur einzeln, jeder Treibstoffplatz einer Lokomotive fasst also ein Stück.
