heading_mixing=Stufen mischen
page_rolling_stock_mixing=Ein Zug ist nur so schnell wie sein langsamstes Fahrzeug. Der Schnellzug Wagon ist schneller als der Schnellzug und bremst ihn deshalb nie aus, eine Mk2 Lokomotive aber schon. Kombiniere Mk2 Lokomotiven mit Mk2 Wagons.
